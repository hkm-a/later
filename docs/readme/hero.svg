<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Later 链接收件箱</title>
  <desc id="desc">本地优先的稍后处理链接收件箱，把临时链接依次放入收件箱、今日队列和归档。</desc>
  <rect width="1200" height="400" rx="24" fill="#151714"/>
  <rect x="1" y="1" width="1198" height="398" rx="23" fill="none" stroke="#3b423d"/>

  <g id="title-block" transform="translate(64 58)">
    <rect width="188" height="32" rx="16" fill="#26362d"/>
    <circle cx="20" cy="16" r="5" fill="#91c59e"/>
    <text x="36" y="22" fill="#cce5d2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">LOCAL-FIRST INBOX</text>
    <text x="0" y="107" fill="#f5f4ee" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700">Later</text>
    <text x="2" y="151" fill="#d5d9d3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="25">把链接先收好，再决定今天看什么。</text>
    <text x="2" y="188" fill="#98a39b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21">无需账户 · IndexedDB 本地存储 · 完成与丢弃可恢复</text>
    <path d="M2 234H520" stroke="#3d4540" stroke-width="2"/>
    <text x="2" y="274" fill="#d7ddd8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">REACT 19</text>
    <text x="145" y="274" fill="#d7ddd8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">VITE 8</text>
    <text x="258" y="274" fill="#b5a8ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">NO BACKEND</text>
  </g>

  <g id="workflow-proof" transform="translate(680 47)">
    <rect width="452" height="306" rx="20" fill="#1d211e" stroke="#455049"/>
    <text x="26" y="37" fill="#aeb9b1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">ONE QUIET WORKFLOW</text>

    <g id="capture" transform="translate(26 56)">
      <rect width="400" height="50" rx="11" fill="#f2f0e9"/>
      <circle cx="25" cy="25" r="7" fill="#91c59e"/>
      <text x="46" y="31" fill="#31352f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17">粘贴要稍后处理的链接</text>
      <rect x="316" y="9" width="74" height="32" rx="8" fill="#292c28"/>
      <text x="353" y="30" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" font-weight="600">收下</text>
    </g>

    <path d="M76 136H376" stroke="#4a554e" stroke-width="2"/>
    <path d="M176 130L184 136L176 142M289 130L297 136L289 142" fill="none" stroke="#7f8d84" stroke-width="2"/>

    <g id="stages" transform="translate(26 154)">
      <g>
        <rect width="116" height="92" rx="12" fill="#29372f" stroke="#4e6757"/>
        <text x="16" y="28" fill="#a9d6b4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">INBOX</text>
        <text x="16" y="58" fill="#f1f4f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" font-weight="700">收件箱</text>
        <text x="16" y="78" fill="#93a298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14">先保存</text>
      </g>
      <g transform="translate(142)">
        <rect width="116" height="92" rx="12" fill="#332f43" stroke="#5c5378"/>
        <text x="16" y="28" fill="#c3b8ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">TODAY · 10</text>
        <text x="16" y="58" fill="#f4f1ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" font-weight="700">今日</text>
        <text x="16" y="78" fill="#aaa1c4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14">最旧优先</text>
      </g>
      <g transform="translate(284)">
        <rect width="116" height="92" rx="12" fill="#3a2e29" stroke="#685047"/>
        <text x="16" y="28" fill="#e3aa91" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">ARCHIVE</text>
        <text x="16" y="58" fill="#fff2ec" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" font-weight="700">归档</text>
        <text x="16" y="78" fill="#bda39a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14">随时恢复</text>
      </g>
    </g>
  </g>
</svg>
